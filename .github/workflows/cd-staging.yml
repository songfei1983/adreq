name: cd-staging

on:
  workflow_dispatch:
    inputs:
      image:
        description: Optional image ref to deploy (default: build & push sha-<sha> for this run)
        required: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          if [ -n "${{ inputs.image }}" ]; then
            echo "image=${{ inputs.image }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=ghcr.io/${{ github.repository }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        if: ${{ inputs.image == '' }}
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ github.repository }}:latest

      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"

      - name: Apply manifests
        run: kubectl apply -k deploy/kustomize/overlays/staging

      - name: Set image
        run: kubectl -n adreq-staging set image deployment/adreq adreq=${{ steps.meta.outputs.image }}

      - name: Rollout status
        run: kubectl -n adreq-staging rollout status deployment/adreq --timeout=180s

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n adreq-staging get pods -l app.kubernetes.io/name=adreq -o wide || true
          kubectl -n adreq-staging describe deployment adreq || true
